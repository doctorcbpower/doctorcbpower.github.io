<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} &mdash; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
<div class="site">

<header class="site-header">
  <div class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
  <nav class="site-nav">
    {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>

<main>
{{ content }}
</main>

<footer class="site-footer">
  &copy; {{ site.time | date: '%Y' }} {{ site.title }}
</footer>

</div>
</body>
</html>
